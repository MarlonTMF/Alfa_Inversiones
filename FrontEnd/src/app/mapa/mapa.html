<div class="map-wrapper">
    <div id="map" class="map-container"></div>

    <!-- BARRA DE FILTROS SUPERIOR ( GLASS ) -->
    <div class="top-filters-bar">
        <!-- Progress bar de carga ( Premium / Glass ) -->
        <div class="loader-line-container" *ngIf="amenidadesService.cargando()">
            <div class="loader-line"></div>
        </div>

        <button class="filter-pill" [class.active]="amenidadesService.mostrarMercados()"
            (click)="amenidadesService.toggleMercados()">
            🛒 Mercados
        </button>
        <button class="filter-pill" [class.active]="amenidadesService.mostrarTransporte()"
            (click)="amenidadesService.toggleTransporte()">
            🚌 Transporte
        </button>
        <button class="filter-pill" [class.active]="amenidadesService.mostrarColegios()"
            (click)="amenidadesService.toggleColegios()">
            📚 Colegios
        </button>
        <button class="filter-pill" [class.active]="amenidadesService.mostrarHospitales()"
            (click)="amenidadesService.toggleHospitales()">
            🏥 Salud
        </button>
    </div>

    <!-- EXPLORADOR LATERAL IZQUIERDO -->
    <aside class="explorer-panel glass-panel">
        <div class="explorer-header">
            <h3 class="explorer-title">📍 Explorador de Activos</h3>
        </div>
        <div class="explorer-content">
            <div class="property-card-small" *ngFor="let t of terrenosCercanos()"
                [class.selected]="terrenoSeleccionado?.id === t.id" (click)="seleccionarTerrenoDesdeLista(t)">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 13px; font-weight: 700; color: white;">{{ t.ubicacion }}</span>
                    <span style="font-size: 11px; color: #10b981; font-weight: 800;">14.2%</span>
                </div>
                <p style="font-size: 11px; color: #94a3b8; margin: 4px 0 0 0;">Cochabamba • ${{ t.precio | number }}</p>
            </div>
        </div>
    </aside>

    <!-- TARJETA DE DETALLE INFERIOR ( GLASS ) -->
    <div class="bottom-detail-panel" *ngIf="terrenoSeleccionado">
        <div class="detail-card glass-panel animate-slide-up">
            <button class="btn-close-bottom" (click)="cerrarPanel()">✕</button>

            <div class="detail-image-section">
                <img src="https://picsum.photos/seed/prop1/600/400" alt="Terreno" class="detail-image">
            </div>

            <div class="detail-content-section">
                <div class="detail-top-info">
                    <div class="detail-title-group">
                        <p class="detail-location">Bolivia • Cochabamba</p>
                        <h2>{{ terrenoSeleccionado.ubicacion }}</h2>
                    </div>
                    <div class="roi-badge">
                        <span class="roi-label">ROI Proyectado</span>
                        <span class="roi-value">14.2%</span>
                    </div>
                </div>

                <div class="detail-stats-grid">
                    <div class="stat-item">
                        <div class="stat-icon">📈</div>
                        <div class="stat-info">
                            <span class="stat-label">SUPERFICIE</span>
                            <span class="stat-value">{{ terrenoSeleccionado.superficie | number }} m²</span>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">💰</div>
                        <div class="stat-info">
                            <span class="stat-label">PRECIO</span>
                            <span class="stat-value">${{ terrenoSeleccionado.precio | number }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
