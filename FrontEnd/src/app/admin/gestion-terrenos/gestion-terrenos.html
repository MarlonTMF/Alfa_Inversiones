<div class="page-container fade-in">
    <header class="page-header">
        <div class="header-content">
            <div>
                <p class="subtitle">PORTFOLIO ASSET MANAGEMENT</p>
                <h1>Propiedades</h1>
            </div>
        </div>
    </header>

    <section class="toolbar-section">
        <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search by name or ID...">
        </div>

        <div class="filter-group">
            <button class="filter-btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                LOCATION
            </button>
            <button class="filter-btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                TYPE
            </button>
            <button class="filter-btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                LEGAL STATUS
            </button>
        </div>
    </section>

    <div class="properties-grid">
        @for (terreno of terrenos; track terreno.id) {
            <div class="property-card" [routerLink]="['/analisis', terreno.id]">
                <div class="property-image-container">
                    <img [src]="terreno.img" [alt]="terreno.nombre" class="property-image">
                    <span class="status-badge-absolute" [ngClass]="terreno.estadoClase">{{ terreno.estado }}</span>
                </div>
                <div class="property-details">
                    <div class="property-header">
                        <div>
                            <h3 class="property-title">{{ terreno.nombre }}</h3>
                            <p class="property-owner">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                Owner: {{ terreno.propietario }}
                            </p>
                        </div>
                        <div class="property-value">
                            <span class="value-amount">${{ terreno.valor }}</span>
                            <span class="value-label">EST. VALUE</span>
                        </div>
                    </div>
                    
                    <div class="property-footer">
                        <div class="specs-container">
                            <div class="spec-item">
                                <span class="spec-label">AREA</span>
                                <span class="spec-value">{{ terreno.area }} m²</span>
                            </div>
                            <div class="spec-item">
                                <span class="spec-label">TYPE</span>
                                <span class="spec-value">{{ terreno.tipo }}</span>
                            </div>
                        </div>
                        <button class="btn-arrow">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </button>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
