<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-primary-container": "#00285d",
                    "on-secondary-container": "#aeb9d0",

                    "surface-container": "#171f33",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; color: #dae2fd; }
        .glass-card {
            background: rgba(45, 52, 73, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-12">
<!-- TopAppBar Execution -->
<header class="bg-[#0b1326]/80 backdrop-blur-xl fixed top-0 w-full z-50 shadow-2xl flex justify-between items-center px-6 py-4 max-w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#3b82f6] cursor-pointer active:scale-95 duration-150">close</span>
<h1 class="font-['Inter'] text-lg font-semibold tracking-tight text-on-surface">Nueva Actualización</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-[#c2c6d6] hover:bg-[#222a3d] transition-colors p-2 rounded-full cursor-pointer">more_vert</span>
</div>
</header>
<main class="pt-24 px-5 space-y-8 max-w-md mx-auto">
<!-- Step Indicator -->
<div class="flex gap-2">
<div class="h-1.5 flex-1 bg-[#3b82f6] rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Section 1: Milestone Selector -->
<section class="space-y-4">
<label class="font-['Inter'] text-[11px] font-bold uppercase tracking-widest text-[#3b82f6]">Hito de la Obra</label>
<div class="flex overflow-x-auto pb-2 gap-3 no-scrollbar">
<button class="flex-shrink-0 px-5 py-3 rounded-lg bg-[#3b82f6]/10 border border-[#3b82f6] text-[#3b82f6] flex flex-col items-center gap-1 transition-all active:scale-95">
<span class="material-symbols-outlined">architecture</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider">Cimientos</span>
</button>
<button class="flex-shrink-0 px-5 py-3 rounded-lg bg-surface-container-high text-on-surface-variant flex flex-col items-center gap-1 transition-all hover:bg-[#222a3d] active:scale-95">
<span class="material-symbols-outlined">domain</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider">Estructura</span>
</button>
<button class="flex-shrink-0 px-5 py-3 rounded-lg bg-surface-container-high text-on-surface-variant flex flex-col items-center gap-1 transition-all hover:bg-[#222a3d] active:scale-95">
<span class="material-symbols-outlined">format_paint</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider">Acabados</span>
</button>
<button class="flex-shrink-0 px-5 py-3 rounded-lg bg-surface-container-high text-on-surface-variant flex flex-col items-center gap-1 transition-all hover:bg-[#222a3d] active:scale-95">
<span class="material-symbols-outlined">bolt</span>
<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider">Servicios</span>
</button>
</div>
</section>
<!-- Section 2: Input Content -->
<section class="space-y-6">
<div class="space-y-2">
<label class="font-['Inter'] text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">Título del Avance</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-4 text-on-surface focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6] outline-none transition-all placeholder:opacity-30" placeholder="Ej: Finalización de platea sector A" type="text"/>
</div>
<div class="space-y-2">
<label class="font-['Inter'] text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">Descripción Detallada</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-4 text-on-surface focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6] outline-none transition-all placeholder:opacity-30 resize-none" placeholder="Describe los avances logrados en este periodo..." rows="4"></textarea>
</div>
</section>
<!-- Section 3: Media Upload -->
<section class="space-y-4">
<label class="font-['Inter'] text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">Registro Fotográfico y Video</label>
<div class="grid grid-cols-3 gap-3">
<div class="aspect-square rounded-lg overflow-hidden relative group">
<img class="w-full h-full object-cover" data-alt="A professional high-angle photograph of a construction site foundation featuring reinforced steel bars and fresh concrete in a dark-mode atmospheric lighting. The scene is dominated by deep blues and architectural grays with bright yellow safety accents. The lighting is dramatic, highlighting the texture of the building materials and industrial machinery. The overall mood is precise and technological, consistent with a high-end project management dashboard." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgjAKEs691s_CZ-YD6f9w_hyyJe7xEM08a8U852bAZG1v7hEYIIytjfvNFPHENHtfO4aD-PIL4AwmX7u8Zkk00GSijFM-UtiZ6aVVbwW3_E0JJvhEl1Cjw_jO1ZHfYV76iHIcYllYmSOcBhXoYIqe3mmAYifQXK6Nm0eHLfHk_fVav5-Ng8AolXy33CoDJM02jFYsQmOt_2rr8FER1-hFVaEMOTrGrPidtGNcdklfZnQFHWmHWgv3ZZCV0yW-IsYH9Mh1c_Hptb8f4"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">delete</span>
</div>
</div>
<div class="aspect-square rounded-lg overflow-hidden relative group">
<img class="w-full h-full object-cover" data-alt="A wide cinematic shot of a construction crane silhouette against a deep twilight blue sky over a modern urban development site. The image uses a cool color palette with high contrast between the dark structures and the subtle architectural lighting of the surrounding city. The composition is sleek and professional, emphasizing the scale of institutional real estate investment. Minimalist and high-end photographic style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0OLlAzXWRZ1N-yYCvztNftFSDZrIiTiW7NG1LRLSRXYEYoKA_wxG9U8u613Iin-TzV2W5JcnVeSW-VYi41yThHhk27rrB9RT5oIHKyOTezLFQtafRiUTrKLICP5YnhDnOq3zVWN3fpr8qoekPORa7XadPUdc0IO9fsVfqecxismM7h7KMJX4hOTKh4agIJPKzMOWHPGXv6Wh5sV6BzYlkdrk0eI97Ap42yDdwgpwGWKonRtVjm2FIxK6XLQsbMMCmi_HnLStKUqYA"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">delete</span>
</div>
</div>
<button class="aspect-square rounded-lg border-2 border-dashed border-outline-variant/30 bg-surface-container-low flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:border-[#3b82f6] hover:text-[#3b82f6] transition-colors">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="text-[9px] font-bold uppercase tracking-tighter">Añadir</span>
</button>
</div>
</section>
<!-- Section 4: Settings Swiches -->
<section class="space-y-3">
<div class="bg-surface-container-low p-4 rounded-xl flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-[#3b82f6]">notifications_active</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface">Notificar a Inversores</p>
<p class="text-[10px] text-on-surface-variant">Envío de alerta vía email y push</p>
</div>
</div>
<div class="w-12 h-6 bg-[#3b82f6] rounded-full relative p-1 cursor-pointer">
<div class="w-4 h-4 bg-white rounded-full ml-auto"></div>
</div>
</div>
<div class="bg-surface-container-low p-4 rounded-xl flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-[#bcc7de]">public</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface">Publicar en Portal Público</p>
<p class="text-[10px] text-on-surface-variant">Visible para prospectos de ventas</p>
</div>
</div>
<div class="w-12 h-6 bg-surface-container-highest rounded-full relative p-1 cursor-pointer">
<div class="w-4 h-4 bg-on-surface-variant rounded-full"></div>
</div>
</div>
</section>
<!-- Section 5: Action Button -->
<div class="pt-4">
<button class="w-full py-4 bg-[#3b82f6] text-white font-bold rounded-lg shadow-lg shadow-[#3b82f6]/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">cloud_upload</span>
                Publicar Actualización
            </button>
<p class="text-center text-[10px] text-on-surface-variant mt-4 opacity-50 uppercase tracking-[0.1em]">Esta acción es irreversible y quedará registrada en el blockchain</p>
</div>
</main>
<!-- Visual Polish: Bottom Glow -->
<div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-background to-transparent pointer-events-none z-40"></div>
</body></html>
