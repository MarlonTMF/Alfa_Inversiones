<form [formGroup]="formulario" class="grid grid-cols-1 md:grid-cols-12 gap-12 animate-in">
    <!-- COLUMNA IZQUIERDA: DEFINICIÓN TÉCNICA -->
    <div class="md:col-span-8 space-y-10">
        <!-- ESPECIALIDADES -->
        <div class="space-y-6">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-blue-500">engineering</span>
                <h3 class="text-xs font-black uppercase tracking-widest text-white">1. Áreas de Especialización</h3>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button type="button"
                        *ngFor="let opt of opciones"
                        [hidden]="opt.group !== 'especialidades'"
                        (click)="toggle(opt)"
                        class="flex items-center gap-4 p-4 rounded-2xl border transition-all text-left"
                        [class.bg-blue-500/10]="checked(opt)"
                        [class.border-blue-500/30]="checked(opt)"
                        [class.bg-white/5]="!checked(opt)"
                        [class.border-white/5]="!checked(opt)">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center transition-all"
                         [class.bg-blue-500]="checked(opt)"
                         [class.bg-white/5]="!checked(opt)"
                         [class.text-white]="checked(opt)"
                         [class.text-slate-500]="!checked(opt)">
                        <span class="material-symbols-outlined text-sm">precision_manufacturing</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-[11px] font-black uppercase tracking-tight" [class.text-white]="checked(opt)" [class.text-slate-400]="!checked(opt)">{{ opt.label }}</p>
                        <p class="text-[9px] font-bold text-slate-600 uppercase">Capacidad Técnica {{ checked(opt) ? 'Asignada' : 'Disponible' }}</p>
                    </div>
                    <span class="material-symbols-outlined text-sm" [class.text-blue-400]="checked(opt)" [class.text-slate-800]="!checked(opt)">
                        {{ checked(opt) ? 'check_circle' : 'circle' }}
                    </span>
                </button>
            </div>
        </div>

        <!-- MAQUINARIA -->
        <div class="space-y-6">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-blue-500">construction</span>
                <h3 class="text-xs font-black uppercase tracking-widest text-white">2. Parque de Maquinaria Propia</h3>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <button type="button"
                        *ngFor="let opt of opciones"
                        [hidden]="opt.group !== 'maquinaria'"
                        (click)="toggle(opt)"
                        class="flex items-center gap-3 p-3 rounded-2xl border transition-all text-left"
                        [class.bg-blue-500/10]="checked(opt)"
                        [class.border-blue-500/30]="checked(opt)"
                        [class.bg-white/5]="!checked(opt)"
                        [class.border-white/5]="!checked(opt)">
                    <span class="material-symbols-outlined text-sm" [class.text-blue-400]="checked(opt)" [class.text-slate-600]="!checked(opt)">
                        {{ checked(opt) ? 'check_box' : 'check_box_outline_blank' }}
                    </span>
                    <span class="text-[10px] font-black uppercase tracking-tight" [class.text-white]="checked(opt)" [class.text-slate-500]="!checked(opt)">{{ opt.label }}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- COLUMNA DERECHA: EXPERIENCIA / MÉTTRICAS -->
    <div class="md:col-span-4 space-y-8">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-blue-500">military_tech</span>
            <h3 class="text-xs font-black uppercase tracking-widest text-white">3. Historial Industrial</h3>
        </div>

        <div class="bg-black/20 rounded-3xl p-6 border border-white/5 space-y-6">
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Capacidad de Obra</p>
                    <span class="text-[9px] font-black text-blue-400 uppercase tracking-widest">Nivel Avanzado</span>
                </div>
                <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 w-3/4 shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-white/5">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 group hover:bg-white/10 transition-all">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-[10px] font-black text-blue-400 uppercase tracking-tight">Infraestructura Vial</p>
                        <span class="material-symbols-outlined text-[12px] text-slate-600">verified</span>
                    </div>
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Proyectos mayores a $5M USD</p>
                </div>
                
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 group hover:bg-white/10 transition-all">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-[10px] font-black text-blue-400 uppercase tracking-tight">Edificación Civil</p>
                        <span class="material-symbols-outlined text-[12px] text-slate-600">verified</span>
                    </div>
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Torres residenciales +20 pisos</p>
                </div>
            </div>

            <button type="button" disabled title="Próximamente" class="w-full py-4 rounded-2xl border border-dashed border-white/10 text-[9px] font-black text-slate-500 uppercase tracking-widest disabled:opacity-40 disabled:cursor-not-allowed">
                + Vincular Portfolio PDF
            </button>
        </div>
    </div>
</form>
