<div class="animate-in fade-in duration-500">
  <!-- Top Tabs Navigation (Project Specific) -->
  <!-- top-16 (64px), no top-0: el panel admin ya tiene su propia cabecera fija
       de 64px (.admin-topbar, posicionada de forma absoluta dentro del mismo
       contenedor con scroll). Con top-0 esta barra subia hasta pegarse justo
       donde esta esa cabecera, chocando con ella al hacer scroll. -->
  <div class="bg-surface-container-low border-b border-white/5 sticky top-16 z-20">
    <div class="px-8 flex items-center justify-between h-14">
      <div class="flex items-center gap-6">
        <h2 class="text-sm font-black text-primary uppercase tracking-tighter">{{ proyecto?.nombre || 'Cargando...' }}</h2>
        <nav class="flex items-center gap-4 ml-6">
          <button (click)="setSeccion('resumen')" class="tab-btn" [class.active]="seccionActual === 'resumen'">Resumen</button>
          <button (click)="setSeccion('planificacion')" class="tab-btn" [class.active]="seccionActual === 'planificacion'">Planificación</button>
          <button (click)="setSeccion('legal')" class="tab-btn" [class.active]="seccionActual === 'legal'">Legal</button>
          <button (click)="setSeccion('bitacora')" class="tab-btn" [class.active]="seccionActual === 'bitacora'">Avances</button>
          <button (click)="setSeccion('inversores')" class="tab-btn" [class.active]="seccionActual === 'inversores'">Inversores</button>
        </nav>
      </div>
      <div class="flex items-center gap-3">
        <button [routerLink]="['/admin/proyectos', proyecto?.id, 'editar']" class="text-[10px] font-bold text-on-surface-variant hover:text-white uppercase tracking-widest px-3 py-1 border border-white/10 rounded">
          Configuración
        </button>
      </div>
    </div>
  </div>

  <!-- Content Area -->
  <div class="project-content">
    <app-proyecto-resumen *ngIf="seccionActual === 'resumen'" 
      [proyecto]="proyecto" 
      [dashboard]="dashboard"
      [docCount]="docCount"
      [multimediaCount]="multimediaCount"
      [fases]="fases"
      (seccionChange)="setSeccion($event)">
    </app-proyecto-resumen>
    <app-proyecto-planificacion *ngIf="seccionActual === 'planificacion'" [proyecto]="proyecto" [fases]="fases"></app-proyecto-planificacion>
    <app-proyecto-legal *ngIf="seccionActual === 'legal'" [proyecto]="proyecto"></app-proyecto-legal>
    <app-proyecto-bitacora *ngIf="seccionActual === 'bitacora'" [proyecto]="proyecto" [fases]="fases"></app-proyecto-bitacora>
    <app-proyecto-inversores *ngIf="seccionActual === 'inversores'" [proyecto]="proyecto" [inversiones]="dashboard?.inversiones || []"></app-proyecto-inversores>
  </div>
</div>
