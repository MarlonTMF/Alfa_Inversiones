<form [formGroup]="formulario" class="grid grid-cols-1 md:grid-cols-12 gap-6">
    <!-- Technical Definition Card -->
    <section class="md:col-span-7 bg-surface-container-high rounded-xl p-8 shadow-2xl shadow-black/25">
        <div class="flex items-center gap-3 mb-8">
            <span class="material-symbols-outlined text-[#3b82f6]">engineering</span>
            <h3 class="text-sm font-medium uppercase tracking-widest text-[#c2c6d6]">Definición Operativa</h3>
        </div>

        <div class="space-y-6">
            <div class="flex flex-col gap-2">
                <label class="text-[0.6875rem] font-bold uppercase tracking-[0.05em] text-[#8c909f] mb-2">Especialidades Principales</label>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button"
                            *ngFor="let opt of opciones"
                            [hidden]="opt.group !== 'especialidades'"
                            (click)="toggle(opt)"
                            class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant/10 hover:border-[#3b82f6]/40 cursor-pointer transition-all">
                        <input class="rounded border-outline-variant text-[#3b82f6] bg-transparent" type="checkbox" [checked]="checked(opt)"/>
                        <span class="text-sm">{{ opt.label }}</span>
                    </button>
                    <!-- Fallback as it was dynamic in the previous TS but this template needs it static or mapped -->
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-[0.6875rem] font-bold uppercase tracking-[0.05em] text-[#8c909f] mb-2">Maquinaria Propia Disponible</label>
                <div class="grid grid-cols-2 gap-3 mt-2">
                    <button type="button"
                            *ngFor="let opt of opciones"
                            [hidden]="opt.group !== 'maquinaria'"
                            (click)="toggle(opt)"
                            class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-lg border border-outline-variant/10 hover:border-[#3b82f6]/40 cursor-pointer transition-all">
                        <input class="rounded border-outline-variant text-[#3b82f6] bg-transparent" type="checkbox" [checked]="checked(opt)"/>
                        <span class="text-sm flex-1 text-left">{{ opt.label }}</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Experience Card (Right) -->
    <section class="md:col-span-5 flex flex-col gap-6">
        <div class="h-48 rounded-xl overflow-hidden relative">
            <div class="absolute inset-0 bg-[#3b82f6]/20"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b1326] to-transparent"></div>
            <div class="absolute bottom-4 left-4">
                <p class="text-xs font-bold uppercase tracking-widest text-[#3b82f6]">Expertise Industrial</p>
            </div>
        </div>

        <div class="bg-surface-container-high rounded-xl p-8 flex-1">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-sm font-medium uppercase tracking-widest text-[#c2c6d6]">Últimos Proyectos</h3>
                <span class="material-symbols-outlined text-[#adc6ff] text-sm">history</span>
            </div>

            <div class="space-y-4">
                <div class="bg-surface-container-lowest p-4 rounded-lg flex justify-between items-center group hover:bg-[#222a3d] transition-all">
                    <div>
                        <p class="text-[0.6875rem] font-bold uppercase text-[#3b82f6]">Proyecto Alpha</p>
                        <p class="text-xs text-[#8c909f]">Puente Metropolitano</p>
                    </div>
                    <span class="text-sm font-semibold">$2.4M USD</span>
                </div>
                <div class="bg-surface-container-lowest p-4 rounded-lg flex justify-between items-center group hover:bg-[#222a3d] transition-all">
                    <div>
                        <p class="text-[0.6875rem] font-bold uppercase text-[#3b82f6]">Residencial Sky</p>
                        <p class="text-xs text-[#8c909f]">Torre Habitacional</p>
                    </div>
                </div>
            </div>

            <button type="button" class="w-full mt-6 py-3 border border-dashed border-outline-variant/40 rounded-lg text-xs font-bold uppercase tracking-widest text-[#c2c6d6] hover:border-[#3b82f6] hover:text-[#3b82f6] transition-all">
                + Agregar Historial (Opcional)
            </button>
        </div>
    </section>
</form>
