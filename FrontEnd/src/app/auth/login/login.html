<div class="login-overlay animate-fade-in">
    <button class="backdrop" (click)="cerrar()" aria-label="Cerrar modal"></button>
    
    <div class="glass-panel login-box">
        <button class="btn-cerrar-modal" (click)="cerrar()">✕</button>

        <div class="login-header">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M9 8h1"></path><path d="M9 12h1"></path><path d="M9 16h1"></path><path d="M14 8h1"></path><path d="M14 12h1"></path><path d="M14 16h1"></path><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path></svg>
            </div>
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu panel de control de orquestación inmobiliaria</p>
        </div>

        @if (errorLogin) {
            <div class="error-box">{{ errorLogin }}</div>
        }

        <form class="login-form" autocomplete="off" (ngSubmit)="iniciarSesion()">
            <div class="form-group">
                <label for="emailUsuario">Correo Electrónico</label>
                <input id="emailUsuario" type="email" class="form-control" name="email" [(ngModel)]="credenciales.email" placeholder="usuario@empresa.com" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="passUsuario">Contraseña</label>
                <div class="password-wrapper">
                    <input id="passUsuario" [type]="mostrarContrasena ? 'text' : 'password'" class="form-control" name="password" [(ngModel)]="credenciales.password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="btn-toggle-pass" (click)="alternarContrasena()">
                        @if (mostrarContrasena) {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        } @else {
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        }
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Ingresar a mi panel
            </button>

            <div class="login-footer">
                <p>¿No tienes acceso? <a href="mailto:contacto@orquestador.bo" class="highlight">Solicita una auditoría comercial</a></p>
            </div>
        </form>
    </div>
</div>
