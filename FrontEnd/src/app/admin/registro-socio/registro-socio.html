<div class="page-container fade-in">
    <header class="page-header">
        <div class="header-content">
            <div>
                <p class="subtitle">PORTFOLIO MANAGEMENT</p>
                <h1>Registro de Nuevo Socio</h1>
            </div>
        </div>
    </header>

    <form [formGroup]="formularioSocio" class="step-form-container">
        <div class="form-card">
            <div class="card-header-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
                <h3>Datos de la Entidad</h3>
            </div>
            
            <div class="input-group highlight-input" style="margin-bottom: 24px; max-width: 300px;">
                <label for="rol">TIPO DE SOCIO</label>
                <select id="rol" formControlName="rol">
                    <option value="constructor">Constructora</option>
                    <option value="inversionista">Inversionista</option>
                </select>
            </div>

            <div class="form-grid-3">
                <div class="input-group">
                    <label for="nombreEmpresa">EMPRESA / RAZÓN SOCIAL</label>
                    <input id="nombreEmpresa" type="text" formControlName="nombreEmpresa" placeholder="Ej. Constructora Alfa S.A.">
                </div>
                <div class="input-group">
                    <label for="nit">NIT</label>
                    <input id="nit" type="text" formControlName="nit" placeholder="000000000">
                </div>
                <div class="input-group">
                    <label for="representanteLegal">REPRESENTANTE LEGAL</label>
                    <input id="representanteLegal" type="text" formControlName="representanteLegal" placeholder="Nombre Completo">
                </div>
            </div>

            <div class="form-grid-2" style="margin-top: 16px;">
                <div class="input-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input id="email" type="email" formControlName="email" placeholder="usuario@email.com">
                </div>
                <div class="input-group">
                    <label for="telefono">TELÉFONO</label>
                    <input id="telefono" type="text" formControlName="telefono" placeholder="Ej. +591 70000000">
                </div>
            </div>

            <div class="input-group highlight-input" style="margin-top: 24px;">
                <label for="passwordGenerado">CONTRASEÑA TEMPORAL AUTO-GENERADA</label>
                <div class="input-wrapper">
                    <input id="passwordGenerado" type="text" formControlName="passwordGenerado" style="color: #10b981; letter-spacing: 2px;">
                    <button type="button" class="btn-transparent suffix" (click)="regenerarPassword()" style="color: #3b82f6; pointer-events: auto;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
                <p class="input-hint">Esta contraseña se enviará por correo a la entidad para su primer inicio de sesión.</p>
            </div>
        </div>

        <div class="footer-actions-stepper">
            <button type="button" class="btn-outline-cancel" routerLink="/admin/empresas">← Cancelar</button>
            <button type="button" class="btn-solid-next" style="background-color: #10b981;" [disabled]="formularioSocio.invalid" (click)="registrarSocio()">
                Finalizar Registro
            </button>
        </div>
    </form>
</div>
