<form [formGroup]="formulario" class="step-form-container animate-in">
    <div class="space-y-8">
        <div class="flex items-center gap-3 mb-6">
            <span class="material-symbols-outlined text-blue-500">manage_accounts</span>
            <h3 class="text-xs font-black uppercase tracking-widest text-white">Generación de Accesos a la Plataforma</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="input-group">
                <label>Rol de la Cuenta</label>
                <select formControlName="rol">
                    <option value="propietario">Propietario de Terreno</option>
                    <option value="constructor">Constructora</option>
                    <option value="inversionista">Inversionista</option>
                </select>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-2 px-2">Determina el tipo de Dashboard que verá el usuario.</p>
            </div>

            <div class="input-group">
                <label>Nombre Completo / Razón Social</label>
                <input type="text" formControlName="nombrePropietario" placeholder="Ej. Juan Pérez">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="input-group">
                <label>Correo Electrónico (Usuario)</label>
                <input type="email" formControlName="emailPropietario" placeholder="usuario@email.com">
            </div>
            <div class="input-group">
                <label>Teléfono de Contacto</label>
                <input type="text" formControlName="telefonoPropietario" placeholder="Ej. +591 70000000">
            </div>
        </div>

        <div class="highlight-input space-y-4 pt-4">
            <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2 block text-center">Contraseña Temporal Auto-Generada</label>
            <div class="input-wrapper max-w-md mx-auto">
                <input type="text" formControlName="passwordGenerado" readonly class="!text-green-400 !tracking-[0.2em]">
                <button type="button" class="btn-trash !bg-blue-500/10 !text-blue-500 absolute right-2" (click)="regenerarPassword()">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
            <p class="text-center text-[10px] text-slate-500 font-bold uppercase tracking-wider">Esta contraseña será necesaria para el primer acceso.</p>
        </div>
    </div>

    <div class="info-banner-blue">
        <span class="material-symbols-outlined text-green-400">verified_user</span>
        <span>Al finalizar, el activo será vinculado legalmente a esta cuenta y se enviarán los accesos por correo.</span>
    </div>

    <!-- FOOTER -->
    <div class="footer-actions">
        <button type="button" class="btn-outline-lg" (click)="onAtras()">
            <span class="material-symbols-outlined">arrow_back</span> Atrás
        </button>
        <button type="button" class="btn-success-lg" [disabled]="formulario.invalid || cargando" (click)="onSiguiente()">
            <span *ngIf="!cargando" class="flex items-center gap-2">
                Finalizar Registro <span class="material-symbols-outlined">check_circle</span>
            </span>
            <span *ngIf="cargando" class="flex items-center gap-2">
                Procesando... <span class="material-symbols-outlined animate-spin">progress_activity</span>
            </span>
        </button>
    </div>
</form>
