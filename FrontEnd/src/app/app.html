<div class="app-layout">
    <header class="navbar">
    <div class="brand">
        <h1>365SOFT <span>| Inteligencia Inmobiliaria</span></h1>
    </div>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Buscar por ID de activo o zona...">
    </div>

    <div class="user-profile">
        <div class="avatar-circle">👤</div>
    </div>
    </header>

    <div class="main-body">
    <aside class="sidebar">
        <div class="sidebar-section">
        <h3 class="section-title">Vista Principal</h3>
        <a href="#" class="menu-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            Mapa de Activos
        </a>
        </div>

        <div class="sidebar-section">
        <h3 class="section-title">Capas de Amenidades</h3>
        
        <label class="toggle-item">
            <input type="checkbox" [checked]="amenidadesService.mostrarMercados()" (change)="amenidadesService.toggleMercados()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Mercados</span>
        </label>
        
        <label class="toggle-item">
            <input type="checkbox" [checked]="amenidadesService.mostrarTransporte()" (change)="amenidadesService.toggleTransporte()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 21v-2"></path><path d="M16 21v-2"></path><path d="M4 11h16"></path><path d="M10 7h4"></path><path d="M8 15h.01"></path><path d="M16 15h.01"></path></svg>
            <span>Transporte Público</span>
        </label>

        <label class="toggle-item">
            <input type="checkbox" [checked]="amenidadesService.mostrarColegios()" (change)="amenidadesService.toggleColegios()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>Colegios</span>
        </label>

        <label class="toggle-item">
            <input type="checkbox" [checked]="amenidadesService.mostrarHospitales()" (change)="amenidadesService.toggleHospitales()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            <span>Hospitales / Salud</span>
        </label>
        </div>
    </aside>

    <main class="content-area">
        <router-outlet></router-outlet>
    </main>
    </div>
</div>
