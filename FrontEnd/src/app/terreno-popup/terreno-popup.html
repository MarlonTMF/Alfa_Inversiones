<div class="popup-container">
  <h4 class="popup-title">{{ terreno.ubicacion }}</h4>
  
  <div class="popup-row">
    <span class="popup-label">Precio:</span>
    <span class="popup-value">${{ terreno.precio | number }}</span> 
  </div>
  
  <div class="popup-row">
    <span class="popup-label">Superficie:</span>
    <span class="popup-value">{{ terreno.superficie }} m²</span>
  </div>
</div>
