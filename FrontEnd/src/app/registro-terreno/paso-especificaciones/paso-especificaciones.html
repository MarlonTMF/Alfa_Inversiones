<form [formGroup]="formulario" class="step-form-container animate-in">
    <!-- SECCIÓN 1: UBICACIÓN -->
    <div class="space-y-8">
        <div class="flex items-center gap-3 mb-6">
            <span class="material-symbols-outlined text-blue-500">location_on</span>
            <h3 class="text-xs font-black uppercase tracking-widest text-white">1. Ubicación y Trazado Geográfico</h3>
        </div>
        
        <div class="form-grid-4">
            <div class="input-group">
                <label>Categoría</label>
                <select formControlName="categoria">
                    <option value="" disabled selected>Seleccione...</option>
                    @for (cat of categoriasDisponibles; track cat) {
                        <option [value]="cat">{{ cat }}</option>
                    }
                    <option value="Otro">Otro (Especificar)</option>
                </select>
            </div>
            
            <div class="input-group" *ngIf="formulario.get('categoria')?.value === 'Otro'">
                <label>Especificar Categoría</label>
                <input type="text" formControlName="categoriaOtro" placeholder="Ej. Turístico">
            </div>
            
            <div class="input-group">
                <label>Ciudad / Población</label>
                <input type="text" formControlName="ciudad" placeholder="Ej. Cochabamba">
            </div>

            <div class="input-group">
                <label>Zona / Barrio</label>
                <input type="text" formControlName="zona" placeholder="Ej. Cala Cala">
            </div>
        </div>

        <div class="form-grid-2">
            <div class="input-group">
                <label>Dirección Exacta</label>
                <input type="text" formControlName="direccion" placeholder="Ej. Av. Simón López #123">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>Distrito</label>
                    <input type="text" formControlName="distrito" placeholder="Ej. D-12">
                </div>
                <div class="input-group">
                    <label>UV</label>
                    <input type="text" formControlName="uv" placeholder="Ej. 013">
                </div>
            </div>
        </div>

        <!-- MAPA INTERACTIVO -->
        <div class="map-drawing-container">
            <div id="mapa-inline-container" (dblclick)="cerrarPoligono()"></div>
            <div class="map-overlay-controls">
                <div class="map-status-pill">
                    <span class="material-symbols-outlined text-[12px] mr-2">info</span>
                    {{ estadoMapaText }}
                </div>
                
                <button type="button" class="btn-map-undo" (click)="deshacerUltimoPunto()">
                    <span class="material-symbols-outlined text-[14px]">undo</span>
                </button>
                
                <button type="button" class="btn-map-action" (click)="limpiarTrazado()">
                    <span class="material-symbols-outlined text-[14px]">delete</span>
                </button>
                
                <button type="button" class="btn-map-undo !bg-blue-500 !text-white" (click)="cerrarPoligono()" *ngIf="!formulario.get('coordenadas')?.value">
                    <span class="material-symbols-outlined text-[14px] mr-2">task_alt</span> Cerrar Polígono
                </button>
            </div>
        </div>
    </div>

    <hr class="border-white/5 my-8">

    <!-- SECCIÓN 2: DIMENSIONES Y VALOR -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-4">
                <span class="material-symbols-outlined text-blue-500">square_foot</span>
                <h3 class="text-xs font-black uppercase tracking-widest text-white">2. Dimensiones Legales</h3>
            </div>
            <div class="form-grid-3">
                <div class="input-group">
                    <label>Superficie (M²)</label>
                    <div class="input-wrapper has-suffix">
                        <input type="number" formControlName="superficie" placeholder="0.00">
                        <span class="suffix">M²</span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Frente (M)</label>
                    <div class="input-wrapper has-suffix">
                        <input type="number" formControlName="frente" placeholder="0.00">
                        <span class="suffix">M</span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Fondo (M)</label>
                    <div class="input-wrapper has-suffix">
                        <input type="number" formControlName="fondo" placeholder="0.00">
                        <span class="suffix">M</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-4">
                <span class="material-symbols-outlined text-blue-500">payments</span>
                <h3 class="text-xs font-black uppercase tracking-widest text-white">3. Valorización ($US)</h3>
            </div>
            <div class="input-group highlight-input">
                <label>Precio Base de Negociación</label>
                <div class="input-wrapper has-prefix">
                    <span class="prefix">$US</span>
                    <input type="text" formControlName="precioBase" (keyup)="formatearPrecio($event)" placeholder="0.00">
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-actions">
        <button type="button" class="btn-outline-lg" (click)="atras.emit()">
            <span class="material-symbols-outlined">arrow_back</span> Atrás
        </button>
        <button type="button" class="btn-solid-next" [disabled]="formulario.invalid || !formulario.get('coordenadas')?.value" (click)="siguiente.emit()">
            Siguiente Paso <span class="material-symbols-outlined">arrow_forward</span>
        </button>
    </div>
</form>
