<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Overlay -->
  <div class="absolute inset-0 bg-[#060e20]/90 backdrop-blur-sm" (click)="cerrar.emit()"></div>

  <!-- Modal Container -->
  <div class="relative bg-background w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl border border-white/5 shadow-2xl animate-in zoom-in-95 duration-300 custom-scrollbar">
    <!-- Header -->
    <header class="bg-[#0b1326]/80 backdrop-blur-xl sticky top-0 w-full z-50 flex justify-between items-center px-6 py-5 border-b border-white/5">
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-[#3b82f6] cursor-pointer hover:bg-white/5 p-2 rounded-full transition-all" (click)="cerrar.emit()">close</span>
        <h1 class="font-['Inter'] text-lg font-black tracking-tight text-white uppercase tracking-widest">Nueva Actualización</h1>
      </div>
      <div class="flex items-center">
        <span class="material-symbols-outlined text-[#c2c6d6] hover:bg-[#222a3d] transition-colors p-2 rounded-full cursor-pointer">more_vert</span>
      </div>
    </header>

    <main class="p-8 space-y-8">
      <!-- Step Indicator (Visual only for now) -->
      <div class="flex gap-2">
        <div class="h-1.5 flex-1 bg-[#3b82f6] rounded-full"></div>
        <div class="h-1.5 flex-1 bg-white/5 rounded-full"></div>
        <div class="h-1.5 flex-1 bg-white/5 rounded-full"></div>
      </div>

      <!-- Section 1: Milestone Selector -->
      <section class="space-y-4">
        <label class="text-[10px] font-black uppercase tracking-[0.2em] text-[#3b82f6]">Hito de la Obra</label>
        <div class="flex overflow-x-auto pb-2 gap-3 custom-scrollbar">
          <button *ngFor="let hito of hitos" 
                  (click)="seleccionarHito(hito.id)"
                  [class.bg-[#3b82f6]/10]="form.hitoId === hito.id"
                  [class.border-[#3b82f6]]="form.hitoId === hito.id"
                  [class.bg-white/5]="form.hitoId !== hito.id"
                  [class.text-[#3b82f6]]="form.hitoId === hito.id"
                  class="flex-shrink-0 px-6 py-4 rounded-2xl border border-white/5 flex flex-col items-center gap-2 transition-all hover:bg-white/10 min-w-[100px]">
            <span class="material-symbols-outlined text-xl">{{ hito.icono }}</span>
            <span class="text-[9px] font-black uppercase tracking-widest">{{ hito.nombre }}</span>
          </button>
        </div>
      </section>

      <!-- Section 2: Input Content -->
      <section class="space-y-6">
        <div class="space-y-3">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Título del Avance</label>
          <input [(ngModel)]="form.titulo" class="w-full bg-[#060e20] border border-white/5 rounded-2xl p-5 text-white focus:border-[#3b82f6] outline-none transition-all placeholder:text-slate-700 font-bold" placeholder="Ej: Finalización de platea sector A" type="text"/>
        </div>
        <div class="space-y-3">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Descripción Detallada</label>
          <textarea [(ngModel)]="form.descripcion" class="w-full bg-[#060e20] border border-white/5 rounded-2xl p-5 text-white focus:border-[#3b82f6] outline-none transition-all placeholder:text-slate-700 resize-none font-medium text-sm" placeholder="Describe los avances logrados..." rows="4"></textarea>
        </div>
      </section>

      <!-- Section 3: Media Upload -->
      <section class="space-y-4">
        <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">Registro Fotográfico y Video</label>
        <div class="grid grid-cols-3 gap-4">
          <div class="aspect-square rounded-2xl border-2 border-dashed border-white/5 bg-[#060e20] flex flex-col items-center justify-center gap-2 text-slate-500 hover:border-[#3b82f6] hover:text-[#3b82f6] transition-all cursor-pointer relative overflow-hidden">
            <input type="file" multiple (change)="manejarImagenes($event)" class="absolute inset-0 opacity-0 cursor-pointer z-10"/>
            <span class="material-symbols-outlined text-2xl">add_a_photo</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Añadir</span>
          </div>
          <!-- Preview placeholders (Simulated) -->
          <div *ngIf="form.imagenes.length > 0" class="aspect-square rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center text-[10px] font-black text-[#3b82f6]">
            +{{ form.imagenes.length }} ARCHIVOS
          </div>
        </div>
      </section>

      <!-- Section 4: Settings -->
      <section class="space-y-3">
        <div class="bg-[#060e20] p-5 rounded-2xl flex items-center justify-between border border-white/5">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-[#3b82f6]/10 flex items-center justify-center text-[#3b82f6]">
              <span class="material-symbols-outlined">notifications_active</span>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Notificar a Inversores</p>
              <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mt-1">Envío vía email y push</p>
            </div>
          </div>
          <input type="checkbox" [(ngModel)]="form.notificarInversores" class="w-5 h-5 rounded-md border-white/10 bg-[#0b1326] text-[#3b82f6] focus:ring-[#3b82f6]/40 cursor-pointer"/>
        </div>

        <div class="bg-[#060e20] p-5 rounded-2xl flex items-center justify-between border border-white/5">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-slate-400">
              <span class="material-symbols-outlined">public</span>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Publicar en Portal Público</p>
              <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mt-1">Visible para prospectos</p>
            </div>
          </div>
          <input type="checkbox" [(ngModel)]="form.publicarPortal" class="w-5 h-5 rounded-md border-white/10 bg-[#0b1326] text-[#3b82f6] focus:ring-[#3b82f6]/40 cursor-pointer"/>
        </div>
      </section>

      <!-- Section 5: Action Button -->
      <div class="pt-6 border-t border-white/5">
        <button (click)="publicar()" 
                [disabled]="!form.titulo || !form.descripcion"
                class="w-full py-5 bg-[#3b82f6] disabled:opacity-30 disabled:cursor-not-allowed text-white font-black rounded-2xl shadow-xl shadow-[#3b82f6]/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3 text-xs uppercase tracking-widest">
          <span class="material-symbols-outlined text-sm">cloud_upload</span>
          Publicar Actualización
        </button>
        <p class="text-center text-[8px] text-slate-500 mt-6 font-bold uppercase tracking-[0.2em] opacity-50">Esta acción es irreversible y quedará registrada en el blockchain</p>
      </div>
    </main>
  </div>
</div>
