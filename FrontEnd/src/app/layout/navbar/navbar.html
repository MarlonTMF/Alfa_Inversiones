<header class="navbar">
    <div class="navbar-left">
        <button class="mobile-menu-btn" (click)="toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="brand">
            <h1>365SOFT <span>| Inteligencia Inmobiliaria</span></h1>
        </div>
    </div>

    @if (esRutaMapa) {
        <div class="search-container desktop-only">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" class="search-input" placeholder="Buscar por ID de activo o zona...">
        </div>
    }

    <div style="display: flex; align-items: center; gap: 20px;">
        @if (esRutaMapa) {
            <button class="btn-primary desktop-only" routerLink="/registro-terreno" style="padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; border: none; cursor: pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Publicar Propiedad
            </button>
        }

        <div class="user-profile desktop-only">
            @if (usuarioActual) {
                <div class="logged-in-container">
                    <button class="profile-trigger" (click)="toggleMenuPerfil()">
                        <div class="user-info">
                            <span class="user-name">{{ usuarioActual.nombre }}</span>
                            <span class="user-role">{{ usuarioActual.rol }}</span>
                        </div>
                        <div class="avatar-circle active-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <svg class="chevron" [class.rotated]="mostrarMenuPerfil" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>

                    @if (mostrarMenuPerfil) {
                        <div class="profile-dropdown animate-fade-in-down">
                            <div class="dropdown-header">
                                <p class="dropdown-email">{{ usuarioActual.email }}</p>
                            </div>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item">Mi Perfil</button>
                            <button class="dropdown-item">Configuracion</button>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item logout-item" (click)="cerrarSesion()">Cerrar Sesion</button>
                        </div>
                    }
                </div>
            } @else {
                <button class="avatar-circle" (click)="mostrarLogin = true" aria-label="Abrir Login">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
            }
        </div>
    </div>
</header>

@if (mostrarLogin) {
    <app-login 
        (cerrarModal)="mostrarLogin = false" 
        (loginExitoso)="procesarLogin($event)">
    </app-login>
}
