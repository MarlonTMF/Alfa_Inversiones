<div class="relative flex h-screen w-full flex-col overflow-hidden bg-surface">
  <!-- Header -->
  <header class="flex items-center bg-surface p-4 border-b border-white/5 justify-between shrink-0">
    <div class="flex items-center gap-4">
      <button [routerLink]="['/admin/legal/consola']" class="text-white flex size-10 items-center justify-center rounded-2xl hover:bg-surface-container-high transition-all">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div>
        <h2 class="text-white text-lg font-black leading-tight tracking-[-0.015em]">Revisión de KYC v2.4</h2>
        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest">ID de Trámite: {{ tramiteId }}</p>
      </div>
    </div>
    <button class="flex size-10 items-center justify-center rounded-2xl text-white hover:bg-surface-container-high">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </header>

  <!-- Viewer & Log -->
  <main class="flex-1 overflow-y-auto bg-[#060e20] relative">
    <div class="p-8 flex flex-col gap-8 max-w-3xl mx-auto">
      <!-- Document Preview -->
      <div class="relative flex flex-col items-center justify-center bg-surface-container-high aspect-[3/4] rounded-3xl shadow-2xl overflow-hidden group border border-white/5">
        <img alt="" class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:scale-110 transition-transform duration-1000" src="/images/proyecto_torres_prado.webp">
        <div class="relative z-10 flex flex-col items-center gap-6">
          <div class="p-6 rounded-3xl bg-[#3b82f6]/10 border border-[#3b82f6]/20 backdrop-blur-xl shadow-2xl">
            <span class="material-symbols-outlined text-[#3b82f6] text-6xl">description</span>
          </div>
          <p class="text-white font-black tracking-tight">{{ documentoNombre }}</p>
          <button class="flex items-center gap-2 px-6 py-3 bg-[#3b82f6] text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-[#3b82f6]/20 hover:brightness-110 transition-all">
            <span class="material-symbols-outlined text-sm">zoom_in</span>
            PANTALLA COMPLETA
          </button>
        </div>
        <!-- Watermark -->
        <div class="absolute top-6 right-6 bg-rose-500/20 px-3 py-1.5 rounded-xl border border-rose-500/30 backdrop-blur-md">
          <span class="text-rose-500 text-[9px] font-black uppercase tracking-[0.2em]">Confidencial</span>
        </div>
      </div>

      <!-- Audit History -->
      <section class="bg-[#131b2e] rounded-3xl p-8 mb-40 border border-white/5 shadow-2xl">
        <div class="flex items-center justify-between mb-8">
          <h3 class="text-white text-base font-black flex items-center gap-3">
            <span class="material-symbols-outlined text-[#3b82f6]">history</span>
            Historial de Auditoría
          </h3>
          <span class="text-slate-500 text-[9px] font-black uppercase tracking-widest bg-[#060e20] px-3 py-1.5 rounded-xl border border-white/5">Inmutable</span>
        </div>
        
        <div class="space-y-8 relative pl-4">
          <!-- Linea Vertical -->
          <div class="absolute left-[11px] top-4 bottom-4 w-0.5 bg-[#3b82f6]/10"></div>
          
          <div *ngFor="let item of historial" class="relative pl-10">
            <div [class]="'absolute left-0 top-1.5 size-6 rounded-full border-2 bg-surface flex items-center justify-center ' + 
              (item.color === 'primary' ? 'border-[#3b82f6]' : item.color === 'tertiary' ? 'border-amber-500' : 'border-slate-700')">
              <div [class]="'size-2 rounded-full ' + (item.color === 'primary' ? 'bg-[#3b82f6]' : item.color === 'tertiary' ? 'bg-amber-500' : 'bg-slate-700')"></div>
            </div>
            <div class="flex justify-between items-start">
              <p class="text-white text-sm font-bold">{{ item.evento }}</p>
              <time class="text-slate-600 text-[10px] font-black uppercase">{{ item.fecha }}</time>
            </div>
            <p class="text-slate-400 text-xs mt-1 font-medium">{{ item.detalle }}</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Bottom Panel -->
  <footer class="bg-surface/80 backdrop-blur-2xl border-t border-white/5 p-6 pb-10 shrink-0 shadow-[0_-20px_40px_rgba(0,0,0,0.3)]">
    <div class="max-w-md mx-auto space-y-6">
      <div class="flex flex-col gap-3">
        <label class="text-slate-500 text-[9px] font-black uppercase tracking-[0.2em] ml-1">Decisión del Auditor</label>
        <div class="flex gap-3">
          <button class="flex-1 flex flex-col items-center justify-center gap-2 py-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-[#3b82f6]/30 transition-all group">
            <span class="material-symbols-outlined text-[#3b82f6] group-hover:scale-110 transition-transform">verified</span>
            <span class="text-[10px] font-black text-white uppercase tracking-widest">Aprobar</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center gap-2 py-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 hover:border-amber-500/30 transition-all group">
            <span class="material-symbols-outlined text-amber-500 group-hover:scale-110 transition-transform">edit_note</span>
            <span class="text-[10px] font-black text-white uppercase tracking-widest">Subsanar</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center gap-2 py-4 rounded-2xl bg-rose-500/5 border border-rose-500/10 hover:bg-rose-500/10 transition-all group">
            <span class="material-symbols-outlined text-rose-500 group-hover:scale-110 transition-transform">cancel</span>
            <span class="text-[10px] font-black text-white uppercase tracking-widest">Rechazar</span>
          </button>
        </div>
      </div>
      <div class="relative">
        <textarea [(ngModel)]="comentarios" class="w-full bg-[#060e20] border border-white/5 rounded-2xl p-4 text-sm text-white placeholder:text-slate-700 outline-none focus:border-[#3b82f6] min-h-[100px] transition-all" placeholder="Agregar comentarios de validación..."></textarea>
      </div>
      <button (click)="confirmar()" class="w-full py-5 bg-[#3b82f6] text-white rounded-2xl font-black text-xs uppercase tracking-[0.3em] shadow-xl shadow-[#3b82f6]/20 flex items-center justify-center gap-3 hover:brightness-110 active:scale-95 transition-all">
        <span class="material-symbols-outlined">send</span>
        CONFIRMAR AUDITORÍA
      </button>
    </div>
  </footer>
</div>
